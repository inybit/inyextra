{{- $lang := .Type | default "text" -}}
{{- $title := or .Attributes.title .Attributes.filename $lang -}}
<div class="code-block" data-language="{{ $lang }}">
  <div class="code-header">
    <div class="code-header-left">
      <span class="code-indicator"></span>
      <span class="code-lang">{{ $title }}</span>
    </div>
    <button class="copy-btn" aria-label="复制代码" title="复制代码" type="button">
      <svg class="copy-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span class="copy-text">复制</span>
    </button>
  </div>
  {{- highlight .Inner $lang "" -}}
</div>
